services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rasa_backend
    ports:
      - "8000:8000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      RASA_SERVER_URL: http://rasa:5005
      DATABASE_NAME: /app/storage/complaints.db
    volumes:
      - ./storage:/app/storage

  actions:
    build:
      context: .
      dockerfile: Dockerfile.actions
    container_name: rasa_actions
    ports:
      - "5055:5055"
    environment:
      BACKEND_BASE_URL: http://backend:8000
    depends_on:
      - backend

  rasa:
    build:
      context: .
      dockerfile: Dockerfile.rasa
    container_name: rasa_server
    ports:
      - "5005:5005"
    depends_on:
      - backend
      - actions